<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicorn Flood</title>
<link rel="stylesheet" href="../play/game.css">
<body>
<img hidden src="./sprites/unicorn.svg" alt="">
<canvas id="background"></canvas><canvas id="scene" aria-label="Fortress battlefield"></canvas><canvas id="foreground"></canvas>
<main>
<header><div><small>FORTRESS COMMAND / MEADOW GATE</small><h1>UNICORN FLOOD</h1></div><div class="report"><small>ONE-LEVEL SCALE TEST</small><strong>One million unicorns. No progression.</strong></div></header>
<section id="status" aria-live="polite"><span>INTEGRITY <b>1,000,000 / 1,000,000</b></span><span>CONTACTS <b>0 live · 0 / 1,000,000</b></span><span>RESOURCES <b>1,000 Stars</b></span></section>
<label>Tower <select id="tower-kind"><option value="0">Star Blaster</option><option value="1">Cloud Mortar</option><option value="2">Friendship Coil</option><option value="3">Rainbow Sprayer</option><option value="4">Candy Cannon</option><option value="5">Prism Beam</option><option value="6">Cupcake Launcher</option></select></label>
<label>Ability <select id="ability"><option value="missile">Magic Missile</option><option value="freeze">Freeze Rainbow</option><option value="flyby">Pegasus Flyby</option><option value="divine">Divine Rainbow</option><option value="apocalypse">Unicorn Apocalypse</option></select></label>
<section id="build" aria-label="Build selected tower on a pad"></section>
<p id="summary" role="status"></p>
<footer><span>Right-drag to pan · Scroll to zoom</span><div><button id="start-wave" type="button">Start 1,000,000 unicorn test</button> <button id="retry" type="button">Restart test</button> <button id="pause" type="button">Pause</button> <button id="speed" type="button">1x speed</button></div><span id="missile">Click battlefield: Magic Missile ready</span></footer>
</main>
<script type="module" src="./index.js"></script>
</body></html>
