<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicorn Flood</title>
<link rel="stylesheet" href="../play/game.css">
<body>
<img hidden src="./sprites/unicorn.svg" alt="">
<canvas id="background"></canvas><canvas id="scene" aria-label="Fortress battlefield"></canvas><canvas id="foreground"></canvas>
<main>
<header><div><small>FORTRESS COMMAND / MEADOW GATE</small><h1>UNICORN FLOOD</h1></div><div class="report"><small>FIELD TEST 01</small><strong>Hold the gate.</strong></div></header>
<section id="status" aria-live="polite"><span>INTEGRITY <b>100 / 100</b></span><span>CONTACTS <b>180</b></span><span>RESOURCES <b>180 Stars</b></span></section>
<label>Tower <select id="tower-kind"><option value="0">Star Blaster</option><option value="1">Cloud Mortar</option><option value="2">Friendship Coil</option></select></label>
<label>Ability <select id="ability"><option value="missile">Magic Missile</option><option value="freeze">Freeze Rainbow</option></select></label>
<section id="build" aria-label="Build selected tower on a pad"></section>
<section id="upgrades" hidden><h2>Upgrade and retry</h2><p id="summary"></p><p id="sparkles"></p><button id="upgrade-damage" type="button">Damage</button><button id="upgrade-rate" type="button">Fire rate</button></section><p id="save-status" role="status"></p>
<footer><span>Right-drag to pan · Scroll to zoom</span><div><button id="start-wave" type="button">Start wave</button> <button id="retry" type="button">Retry</button> <button id="pause" type="button">Pause</button> <button id="speed" type="button">1x speed</button></div><span id="missile">Click battlefield: Magic Missile ready</span></footer>
</main>
<script type="module" src="./index.js"></script>
</body></html>
